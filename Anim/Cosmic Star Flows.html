<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Star Flows</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000000;
    overflow: hidden;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let W = canvas.width  = window.innerWidth;
let H = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  buildFlows();
});

// ─── Mouse ───────────────────────────────────────────────────────────────────
const mouse = { x: -9999, y: -9999 };
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

// ─── Gravity wells (right-click) ─────────────────────────────────────────────
const gravityWells = [];
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  gravityWells.push({ x: e.clientX, y: e.clientY, radius: 200, life: 120, time: 0 });
});

// Left-click: smoothly morph all flows to new random curves
canvas.addEventListener('click', () => {
  for (let i = 0; i < NUM_FLOWS; i++) {
    const old = flows[i].curve;
    flows[i].srcCurve    = { p0:{...old.p0}, cp1:{...old.cp1}, cp2:{...old.cp2}, p3:{...old.p3} };
    flows[i].targetCurve = randomCubicBezier();
    flows[i].morphT      = 0;
  }
});

// ─── Config ────────────────────────────────────────────────────────────────
const NUM_FLOWS       = 7;       // number of star streams
const STARS_PER_FLOW  = 70;      // stars per stream
const TRAIL_LENGTH    = 16;      // history positions kept per star
const PATH_WOBBLE     = 0.012;   // how much the path drifts each frame
const SPEED_BASE      = 1.6;     // base travel speed
const SPEED_SPREAD    = 0.9;     // ± speed variation within a flow
const STAR_SIZE_MIN   = 1.8;
const STAR_SIZE_MAX   = 5.0;
const MOUSE_RADIUS    = 120;   // influence radius in px
const MOUSE_STRENGTH  = 6.0;   // push force

// palette: one hue per flow (degrees)
const FLOW_HUES = [200, 240, 270, 300, 180, 220, 260];

// Morph helpers
const MORPH_SPEED = 0.016; // fraction per frame (~60 frames / 1 s to complete)
function lerpPt(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }

// ─── Pre-rendered glow sprites (one offscreen canvas per hue) ───────────────
const SPRITE_R = 40;
const glowSprites = {};

function buildGlowSprites() {
  for (const hue of FLOW_HUES) {
    const s  = SPRITE_R * 2;
    const oc = document.createElement('canvas');
    oc.width = oc.height = s;
    const ox  = oc.getContext('2d');
    const grd = ox.createRadialGradient(SPRITE_R, SPRITE_R, 0, SPRITE_R, SPRITE_R, SPRITE_R);
    grd.addColorStop(0,    `hsla(${hue},100%,96%,1)`);
    grd.addColorStop(0.25, `hsla(${hue},95%,75%,0.8)`);
    grd.addColorStop(0.6,  `hsla(${hue},90%,55%,0.35)`);
    grd.addColorStop(1,    `hsla(${hue},90%,50%,0)`);
    ox.beginPath();
    ox.arc(SPRITE_R, SPRITE_R, SPRITE_R, 0, Math.PI * 2);
    ox.fillStyle = grd;
    ox.fill();
    glowSprites[hue] = oc;
  }
}

// ─── Flow definition ────────────────────────────────────────────────────────
// Each flow is described by a cubic Bezier that spans the canvas.
// We re-generate them on resize.
let flows = [];

function randomCubicBezier() {
  // Start from one of the 4 edges; end on another edge
  const edges = ['top','bottom','left','right'];
  const startEdge = edges[Math.floor(Math.random() * 4)];
  let endEdge;
  do { endEdge = edges[Math.floor(Math.random() * 4)]; } while (endEdge === startEdge);

  function edgePt(edge) {
    switch (edge) {
      case 'top':    return { x: Math.random() * W, y: -20 };
      case 'bottom': return { x: Math.random() * W, y: H + 20 };
      case 'left':   return { x: -20, y: Math.random() * H };
      case 'right':  return { x: W + 20, y: Math.random() * H };
    }
  }

  const p0 = edgePt(startEdge);
  const p3 = edgePt(endEdge);

  // Control points: biased toward screen center with some spread
  const cp1 = {
    x: W * 0.15 + Math.random() * W * 0.7,
    y: H * 0.15 + Math.random() * H * 0.7
  };
  const cp2 = {
    x: W * 0.15 + Math.random() * W * 0.7,
    y: H * 0.15 + Math.random() * H * 0.7
  };

  return { p0, cp1, cp2, p3 };
}

// Evaluate cubic Bezier at t ∈ [0,1]
function bezier(b, t) {
  const u = 1 - t;
  return {
    x: u*u*u*b.p0.x + 3*u*u*t*b.cp1.x + 3*u*t*t*b.cp2.x + t*t*t*b.p3.x,
    y: u*u*u*b.p0.y + 3*u*u*t*b.cp1.y + 3*u*t*t*b.cp2.y + t*t*t*b.p3.y
  };
}

// Bezier tangent (derivative), used to orient stars along the path
function bezierTangent(b, t) {
  const u = 1 - t;
  return {
    x: 3*(u*u*(b.cp1.x-b.p0.x) + 2*u*t*(b.cp2.x-b.cp1.x) + t*t*(b.p3.x-b.cp2.x)),
    y: 3*(u*u*(b.cp1.y-b.p0.y) + 2*u*t*(b.cp2.y-b.cp1.y) + t*t*(b.p3.y-b.cp2.y))
  };
}

// ─── Star class ──────────────────────────────────────────────────────────────
class Star {
  constructor(flowIdx, hue) {
    this.flowIdx = flowIdx;
    this.hue     = hue;
    this.reset(Math.random()); // stagger initial position
  }

  reset(tStart = 0) {
    this.t      = tStart;
    this.speed  = (SPEED_BASE + (Math.random() - 0.5) * 2 * SPEED_SPREAD) / 1000;
    this.size   = STAR_SIZE_MIN + Math.random() * (STAR_SIZE_MAX - STAR_SIZE_MIN);
    this.trail  = [];
    this.wobbleX = 0;
    this.wobbleY = 0;
    this.wobbleVX = (Math.random() - 0.5) * PATH_WOBBLE * 2;
    this.wobbleVY = (Math.random() - 0.5) * PATH_WOBBLE * 2;
    this.opacity  = 0.3 + Math.random() * 0.7;
    this.vx  = 0;   // velocity (Snow Sky-style)
    this.vy  = 0;
    this.offX = 0;  // accumulated displacement from path
    this.offY = 0;
  }

  update() {
    this.t += this.speed;

    // Slight perpendicular drift — gives organic feel while keeping flow shape
    this.wobbleVX += (Math.random() - 0.5) * PATH_WOBBLE;
    this.wobbleVY += (Math.random() - 0.5) * PATH_WOBBLE;
    this.wobbleVX *= 0.92;
    this.wobbleVY *= 0.92;
    this.wobbleX  += this.wobbleVX;
    this.wobbleY  += this.wobbleVY;

    if (this.t > 1) {
      this.reset();
      return;
    }

    const pos = bezier(flows[this.flowIdx].curve, this.t);
    let px  = pos.x + this.wobbleX * 30;
    let py  = pos.y + this.wobbleY * 30;

    // Current displaced position (used for force calculation)
    const cx = px + this.offX;
    const cy = py + this.offY;

    // ── Mouse push (Snow Sky style: force → vx/vy) ──────────────────────────
    const dx   = cx - mouse.x;
    const dy   = cy - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy) + 0.1;
    const mouseForce = Math.min(0.5, MOUSE_RADIUS / (dist * dist)) * MOUSE_STRENGTH * 0.025;
    this.vx += (dx / dist) * mouseForce;
    this.vy += (dy / dist) * mouseForce;

    // ── Gravity wells (Snow Sky style: accelerating pull → vx/vy) ──────────
    for (const gw of gravityWells) {
      const gwdx = gw.x - cx;
      const gwdy = gw.y - cy;
      const gwd  = Math.sqrt(gwdx * gwdx + gwdy * gwdy);
      if (gwd < gw.radius && gwd > 0.5) {
        const pull = Math.pow(gw.time / 120, 4) * (gw.radius - gwd) * 0.02;
        this.vx += (gwdx / gwd) * pull;
        this.vy += (gwdy / gwd) * pull;
      }
    }

    // Friction (same as Snow Sky)
    this.vx *= 0.92;
    this.vy *= 0.92;

    // Accumulate velocity into offset displacement
    this.offX += this.vx;
    this.offY += this.vy;

    // Gently pull offset back to path so stars return when undisturbed
    this.offX *= 0.995;
    this.offY *= 0.995;

    px = cx;
    py = cy;

    this.trail.push({ x: px, y: py });
    if (this.trail.length > TRAIL_LENGTH) this.trail.shift();
  }

  draw() {
    if (this.trail.length < 2) return;

    const len  = this.trail.length;
    const last = this.trail[len - 1];

    // Draw trail in 4 batched chunks to minimize draw calls
    const CHUNKS = 4;
    const chunk  = Math.ceil(len / CHUNKS);
    for (let c = 0; c < CHUNKS; c++) {
      const start = c * chunk;
      const end   = Math.min(start + chunk, len - 1);
      if (start >= end) continue;
      const t     = end / len;
      const alpha = t * this.opacity;
      const lw    = this.size * t;
      ctx.beginPath();
      ctx.moveTo(this.trail[start].x, this.trail[start].y);
      for (let i = start + 1; i <= end; i++) ctx.lineTo(this.trail[i].x, this.trail[i].y);
      ctx.strokeStyle = `hsla(${this.hue},90%,${55 + Math.round(t * 45)}%,${alpha.toFixed(2)})`;
      ctx.lineWidth   = lw < 0.3 ? 0.3 : lw;
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';
      ctx.stroke();
    }

    // Draw glow head via pre-rendered sprite (no gradient per frame)
    const sprite = glowSprites[this.hue];
    const sr     = this.size * 3.5;
    ctx.globalAlpha = this.opacity;
    ctx.drawImage(sprite, last.x - sr, last.y - sr, sr * 2, sr * 2);
    ctx.globalAlpha = 1;

    // Tiny bright core
    ctx.beginPath();
    ctx.arc(last.x, last.y, this.size * 0.7, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(240,245,255,${this.opacity})`;
    ctx.fill();
  }
}

// ─── Build / rebuild flows ───────────────────────────────────────────────────
let stars = [];

function buildFlows() {
  flows = [];
  for (let i = 0; i < NUM_FLOWS; i++) {
    flows.push({
      curve:       randomCubicBezier(),
      hue:         FLOW_HUES[i % FLOW_HUES.length],
      srcCurve:    null,
      targetCurve: null,
      morphT:      1   // 1 = no morph in progress
    });
  }

  stars = [];
  for (let fi = 0; fi < NUM_FLOWS; fi++) {
    for (let si = 0; si < STARS_PER_FLOW; si++) {
      stars.push(new Star(fi, flows[fi].hue));
    }
  }
}

// Slowly morph flow curves over time so the scene never feels static
let morphTimer = 0;
const MORPH_INTERVAL = 420; // frames between curve evolutions

function morphFlows() {
  morphTimer++;
  if (morphTimer < MORPH_INTERVAL) return;
  morphTimer = 0;

  const fi  = Math.floor(Math.random() * NUM_FLOWS);
  const old = flows[fi].curve;
  const pick = Math.random() < 0.5 ? 'cp1' : 'cp2';
  let nx = old[pick].x + (Math.random() - 0.5) * W * 0.18;
  let ny = old[pick].y + (Math.random() - 0.5) * H * 0.18;
  nx = Math.max(-W * 0.1, Math.min(W * 1.1, nx));
  ny = Math.max(-H * 0.1, Math.min(H * 1.1, ny));

  flows[fi].srcCurve    = { p0:{...old.p0}, cp1:{...old.cp1}, cp2:{...old.cp2}, p3:{...old.p3} };
  flows[fi].targetCurve = {
    p0:  old.p0,
    cp1: pick === 'cp1' ? { x: nx, y: ny } : { x: old.cp1.x, y: old.cp1.y },
    cp2: pick === 'cp2' ? { x: nx, y: ny } : { x: old.cp2.x, y: old.cp2.y },
    p3:  old.p3
  };
  flows[fi].morphT = 0;
}

// Advance all in-progress curve morphs each frame
function updateFlowMorphs() {
  for (const flow of flows) {
    if (flow.morphT >= 1) continue;
    flow.morphT = Math.min(1, flow.morphT + MORPH_SPEED);
    // Ease in-out
    const e = flow.morphT < 0.5
      ? 2 * flow.morphT * flow.morphT
      : -1 + (4 - 2 * flow.morphT) * flow.morphT;
    flow.curve = {
      p0:  lerpPt(flow.srcCurve.p0,  flow.targetCurve.p0,  e),
      cp1: lerpPt(flow.srcCurve.cp1, flow.targetCurve.cp1, e),
      cp2: lerpPt(flow.srcCurve.cp2, flow.targetCurve.cp2, e),
      p3:  lerpPt(flow.srcCurve.p3,  flow.targetCurve.p3,  e),
    };
  }
}

// ─── Background starfield ─────────────────────────────────────────────────
const BG_STARS = Array.from({ length: 280 }, () => ({
  x: Math.random(),
  y: Math.random(),
  r: Math.random() * 0.9 + 0.2,
  a: Math.random() * 0.5 + 0.1,
  twinkle: Math.random() * Math.PI * 2
}));

function drawBgStars() {
  for (const s of BG_STARS) {
    s.twinkle += 0.015;
    const alpha = s.a + Math.sin(s.twinkle) * 0.15;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,210,255,${alpha.toFixed(3)})`;
    ctx.fill();
  }
}

// ─── Gravity well visuals ─────────────────────────────────────────────────
function drawGravityWells() {
  for (let i = gravityWells.length - 1; i >= 0; i--) {
    const gw = gravityWells[i];
    gw.time++;
    gw.life--;
    if (gw.life <= 0) { gravityWells.splice(i, 1); continue; }

    const progress = gw.time / 120;
    const fadeOut  = Math.min(1, gw.life / 20);
    const alpha    = fadeOut * 0.75;

    // Ring shrinks as well intensifies — mirrors Snow Sky
    const ringR = gw.radius * (gw.life / 120);
    ctx.beginPath();
    ctx.arc(gw.x, gw.y, ringR, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(180,140,255,${(alpha * 0.4).toFixed(3)})`;
    ctx.lineWidth   = 1.2;
    ctx.stroke();

    const coreR = 6 + progress * progress * 30;
    const grd   = ctx.createRadialGradient(gw.x, gw.y, 0, gw.x, gw.y, coreR);
    grd.addColorStop(0,   `rgba(200,160,255,${(alpha * 0.9).toFixed(3)})`);
    grd.addColorStop(0.5, `rgba(140,100,255,${(alpha * 0.4).toFixed(3)})`);
    grd.addColorStop(1,   'rgba(100,60,255,0)');
    ctx.beginPath();
    ctx.arc(gw.x, gw.y, coreR, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
  }
}

// ─── Main loop ───────────────────────────────────────────────────────────────
function loop() {
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, W, H);

  morphFlows();
  updateFlowMorphs();
  drawBgStars();
  drawGravityWells();

  for (const s of stars) {
    s.update();
    s.draw();
  }

  requestAnimationFrame(loop);
}

buildGlowSprites();
buildFlows();
loop();
</script>
</body>
</html>
